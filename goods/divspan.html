<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>百度一下，你就知道</title>
        <style>
            .top{
                width: 100%;
                height: 100px;
                background-color: white;
                margin: 0 auto;
            }
            #bottom{
                width: 100%;
                height: 100px;
                background-color: #e9d158;
                margin: 10 auto;
            }
            #nav{
                width: 270px;
                height: 129px;
                background-color:white;
                padding-left: 44%;
            }
            #nav img{
                width: 270px;
                height: 129px;
            }
            .span_no{
                font-family: 微软雅黑;
                font-size: 15px;
                color: black;
                line-height: 100px;
                padding-left: 20px;
            }
            .top a{/*对top类的超链接操作*/
                color: black;
                text-decoration: none;/*取消下划线*/
            }
            .top a:hover{/*对top类的超链接悬停操作*/
                color: #378fc1;/*悬停变蓝*/
            }
            .form{
                text-align: center;
                border: 5px solid #d85077;
                width: 600px;
                height: 500px;
                background-color: rgb(209, 174, 174);
                margin: 10px auto;/*顺时针旋转，上右下左*/
            }
            .main{
                text-align: center;
                border: 5px solid #a1c137;
                width: 600px;
                height: 500px;
                background-color: rgb(174, 209, 174);
                margin: 10px auto;/*顺时针旋转，上右下左*/
            }
            .form img{
                margin-top: 20px;
            }
            </style>
    </head>
    <body>
        <div class="top">
            <span class="span_no"><a href="#">新闻</a></span>
            <span class="span_no"><a href="#">hao123</a></span>
            <span class="span_no"><a href="#">地图</a></span>
            <span class="span_no"><a href="#">贴吧</a></span>
            <span class="span_no"><a href="#">视频</a></span>
            <span class="span_no"><a href="#">图片</a></span>
            <span class="span_no"><a href="#">更多</a></span>
        </div>                                                          <!-- div 一个一行；class的样式开头用“.” --><!-- id的样式开头用“#” -->
        <div id="nav">
            <img src="../image/baidu.png" >
        </div> 
        <div class="form">
            内容待定
            <img src="../image/goods/1.webp" >

        <div class="main">

</html>
